<!DOCTYPE html>

<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Quicksort - We Craft Human + AI Collaboration.</title>
    <meta name="description" content="Custom AI copilots and workspace solutions. Implementation leveraging LLMs, Knowledge Graphs, RAG, and Reasoning Models. Deployment across on-premises infrastructure and major cloud platforms. End-to-end delivery of intuitive interfaces and optimized user journeys." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Commit the stored theme before the first paint. Without this the page
      renders dark, then flips to light a frame later for anyone who chose
      light — a visible flash on every navigation.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("qs-theme");
          document.documentElement.dataset.theme =
            stored === "light" || stored === "dark" ? stored : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link href="tailwind.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
