<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quicksort · Slide types</title>
<style>
  html,body{margin:0;height:100%;background:#0c0c0c;font-family:'Inter',sans-serif;overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #frame{
    width:1920px;height:1080px;transform-origin:center center;
    border:0;background:#151515;box-shadow:0 40px 120px rgba(0,0,0,.6);
    border-radius:2px;
  }
  .nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;z-index:10;
    background:rgba(20,20,20,.86);backdrop-filter:blur(20px);
    border:1px solid rgba(250,250,250,.12);border-radius:999px;padding:8px 10px;}
  .nav button{appearance:none;border:0;background:transparent;color:#FAFAFA;
    font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;
    padding:8px 14px;border-radius:999px;transition:background .15s;}
  .nav button:hover{background:rgba(250,250,250,.1);}
  .nav .arrow{font-size:18px;line-height:1;width:36px;padding:8px 0;}
  .nav .count{color:rgba(250,250,250,.5);font-variant-numeric:tabular-nums;padding:0 6px;min-width:48px;text-align:center;}
  .dots{display:flex;gap:6px;padding:0 8px;}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(250,250,250,.22);cursor:pointer;transition:background .15s,transform .15s;}
  .dot.on{background:#CCFF00;transform:scale(1.25);}
  .label{position:fixed;top:22px;left:24px;z-index:10;color:rgba(250,250,250,.55);
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;}
</style>
</head>
<body>
<div class="label" id="label">Title</div>
<div id="stage"><iframe id="frame" src="title.html" scrolling="no"></iframe></div>

<div class="nav">
  <button class="arrow" id="prev" aria-label="Previous">←</button>
  <span class="count" id="count">1 / 7</span>
  <button class="arrow" id="next" aria-label="Next">→</button>
  <div class="dots" id="dots"></div>
</div>

<script>
const SLIDES = [
  { src:"title.html",      name:"Title" },
  { src:"section.html",    name:"Section divider" },
  { src:"statement.html",  name:"Statement" },
  { src:"colours.html",    name:"Brand colours" },
  { src:"two-column.html", name:"Two column" },
  { src:"quote.html",      name:"Quote" },
  { src:"closing.html",    name:"Closing" },
];
const KEY = "qs-slides-idx";
let i = Math.min(SLIDES.length-1, Math.max(0, parseInt(localStorage.getItem(KEY)||"0",10) || 0));

const frame = document.getElementById("frame");
const label = document.getElementById("label");
const count = document.getElementById("count");
const dotsEl = document.getElementById("dots");

SLIDES.forEach((s, idx) => {
  const d = document.createElement("div");
  d.className = "dot";
  d.title = s.name;
  d.addEventListener("click", () => go(idx));
  dotsEl.appendChild(d);
});

function fit(){
  const pad = 64;
  const scale = Math.min((innerWidth-pad)/1920, (innerHeight-140)/1080);
  frame.style.transform = `scale(${scale})`;
}
function render(){
  frame.src = SLIDES[i].src;
  label.textContent = SLIDES[i].name;
  count.textContent = `${i+1} / ${SLIDES.length}`;
  [...dotsEl.children].forEach((d,idx)=>d.classList.toggle("on", idx===i));
  localStorage.setItem(KEY, String(i));
}
function go(n){ i = (n + SLIDES.length) % SLIDES.length; render(); }

document.getElementById("prev").addEventListener("click", ()=>go(i-1));
document.getElementById("next").addEventListener("click", ()=>go(i+1));
addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key===" ") { e.preventDefault(); go(i+1); }
  if(e.key==="ArrowLeft") go(i-1);
});
addEventListener("resize", fit);
fit(); render();
</script>
</body>
</html>
