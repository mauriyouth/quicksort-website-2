<!-- @dsCard group="Slides" viewport="1280x720" name="Slide · Brand colours" subtitle="Swatch grid recreated from the Figma identity slide" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quicksort · Brand colours</title>
<link rel="stylesheet" href="slide.css">
</head>
<body>
<div class="slide slide--light">
  <div class="slide__grid"></div>

  <div class="slide__mark"><img src="../assets/logo-mark-dark.svg" alt="Quicksort"></div>

  <!-- Title capsule (matches Figma 'Brand Colours' lockup) -->
  <div style="position:absolute;left:100px;top:84px;display:none;"></div>

  <div class="slide__body" style="top:228px;">
    <h2 class="disp" style="font-size:60px;color:var(--qs-fg-1);max-width:1500px;line-height:1.05;">
      The Quicksort palette blends professionalism with forward-thinking energy.
    </h2>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:72px;">
      <!-- Signal Lime -->
      <div style="border-radius:16px;background:var(--qs-lime);min-height:430px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;">
        <span style="font-family:var(--qs-font-display);font-size:44px;letter-spacing:-0.05em;color:#141414;">Accent</span>
        <div>
          <div style="font-family:var(--qs-font-sans);font-weight:500;font-size:34px;color:#141414;">#CCFF00</div>
          <div style="font-family:var(--qs-font-sans);font-size:22px;color:rgba(20,20,20,.7);margin-top:8px;">Signal Lime → momentum</div>
        </div>
      </div>
      <!-- Timberwolf -->
      <div style="border-radius:16px;background:var(--qs-timberwolf);min-height:430px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;">
        <span style="font-family:var(--qs-font-display);font-size:44px;letter-spacing:-0.05em;color:#141414;">Neutral</span>
        <div>
          <div style="font-family:var(--qs-font-sans);font-weight:500;font-size:34px;color:#141414;">#D6D6D6</div>
          <div style="font-family:var(--qs-font-sans);font-size:22px;color:rgba(20,20,20,.6);margin-top:8px;">Timberwolf → balance</div>
        </div>
      </div>
      <!-- Dim Gray -->
      <div style="border-radius:16px;background:var(--qs-dim-gray);min-height:430px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;">
        <span style="font-family:var(--qs-font-display);font-size:44px;letter-spacing:-0.05em;color:#fff;">Muted</span>
        <div>
          <div style="font-family:var(--qs-font-sans);font-weight:500;font-size:34px;color:#fff;">#8E8E8E</div>
          <div style="font-family:var(--qs-font-sans);font-size:22px;color:rgba(255,255,255,.82);margin-top:8px;">Dim Gray → clarity</div>
        </div>
      </div>
      <!-- Rich Black -->
      <div style="border-radius:16px;background:var(--qs-ink);min-height:430px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;">
        <span style="font-family:var(--qs-font-display);font-size:44px;letter-spacing:-0.05em;color:#FAFAFA;">Primary</span>
        <div>
          <div style="font-family:var(--qs-font-sans);font-weight:500;font-size:34px;color:#FAFAFA;">#141414</div>
          <div style="font-family:var(--qs-font-sans);font-size:22px;color:rgba(250,250,250,.7);margin-top:8px;">Rich Black → trust</div>
        </div>
      </div>
    </div>
  </div>

  <div class="slide__page">Identity · 04</div>
</div>
</body>
</html>
