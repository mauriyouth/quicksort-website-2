<!doctype html>
<!-- @dsCard group="Components" name="Form fields" subtitle="Input · textarea · status chips" viewport="700x260" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="col" style="gap:10px">
    <div style="position:relative">
      <label class="mono" style="display:block;margin-bottom:6px">Email</label>
      <input value="hello@quicksort.ai" style="width:100%;box-sizing:border-box;font-family:Inter;font-size:15px;padding:12px 14px;border:1px solid rgba(0,7,14,.16);border-radius:10px;background:#fff;color:#000710;outline:none"/>
    </div>
    <div style="position:relative">
      <label class="mono" style="display:block;margin-bottom:6px">Message</label>
      <textarea rows="2" style="width:100%;box-sizing:border-box;font-family:Inter;font-size:15px;padding:12px 14px;border:1px solid rgba(0,7,14,.16);border-radius:10px;background:#fff;color:#000710;outline:none;resize:none">Ask Quicksort to help craft…</textarea>
    </div>
    <div class="row" style="gap:8px">
      <span style="font-family:Inter;font-size:13px;padding:6px 12px;border-radius:999px;background:#141414;color:#FAFAFA">Featured</span>
      <span style="font-family:Inter;font-size:13px;padding:6px 12px;border-radius:999px;background:#CCFF00;color:#141414">New</span>
      <span style="font-family:Inter;font-size:13px;padding:6px 12px;border-radius:999px;background:#FAFAFA;color:#000710;border:1px solid rgba(0,7,14,.08)">Beta</span>
    </div>
  </div>
</div></body></html>
