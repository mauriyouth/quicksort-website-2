<!doctype html>
<!-- @dsCard group="Colors" name="Signal accent" subtitle="Signal Lime + halo treatment + Rich Black" viewport="700x230" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="row" style="gap:14px">
    <div class="col" style="flex:1.4">
      <div style="height:130px;border-radius:12px;background:#CCFF00;position:relative;overflow:hidden">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Hanken Grotesk',sans-serif;font-size:36px;letter-spacing:-0.04em;color:#141414">Signal Lime</div>
      </div>
      <div class="mono">#CCFF00 · one-use-only spotlight</div>
    </div>
    <div class="col" style="flex:1">
      <div style="height:130px;border-radius:12px;background:#FFFFFF;position:relative;overflow:hidden;border:1px solid rgba(0,7,14,.08)">
        <div style="position:absolute;left:50%;top:-60px;width:90%;height:120px;transform:translateX(-50%);border-radius:50%;background:#CCFF00;opacity:0.4;filter:blur(6px)"></div>
      </div>
      <div class="mono">Lime halo · slide top-edge bleed</div>
    </div>
    <div class="col" style="flex:1">
      <div style="height:130px;border-radius:12px;background:#000710"></div>
      <div class="label" style="font-weight:600">Rich Black deep</div>
      <div class="mono">#000710 · body text</div>
    </div>
  </div>
</div></body></html>
