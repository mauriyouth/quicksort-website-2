<!doctype html>
<!-- @dsCard group="Components" name="Cards" subtitle="Capability card + signal (dark + halo) card" viewport="700x220" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="row" style="gap:12px">
    <div style="flex:1;border:1px solid rgba(0,7,14,.08);border-radius:16px;padding:18px;background:#fff">
      <div style="font-family:Inter;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8E8E8E">Capability</div>
      <div style="font-family:'Hanken Grotesk';font-size:22px;color:#000710;margin-top:8px;line-height:1.1">Plan work with a partner, not a prompt.</div>
      <div style="font-family:Inter;font-size:13px;color:#3A3A3A;margin-top:10px;line-height:1.5">Quicksort sits in your workflow, proposes next steps, and hands back control.</div>
    </div>
    <div style="flex:1;border-radius:16px;padding:18px;background:#141414;color:#FAFAFA;position:relative;overflow:hidden">
      <div style="position:absolute;left:50%;top:-40px;width:90%;height:80px;transform:translateX(-50%);border-radius:50%;background:#CCFF00;opacity:.35;filter:blur(8px)"></div>
      <div style="font-family:Inter;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(250,250,250,.6);position:relative">Signal card</div>
      <div style="font-family:'Hanken Grotesk';font-size:22px;margin-top:8px;line-height:1.1;position:relative">Human + AI,<br/>collaborating.</div>
      <div style="font-family:Inter;font-size:13px;color:rgba(250,250,250,.7);margin-top:10px;line-height:1.5;position:relative">The dark card variant with lime halo bleed.</div>
    </div>
  </div>
</div></body></html>
