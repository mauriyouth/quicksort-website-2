<!doctype html>
<!-- @dsCard group="Colors" name="Semantic tokens" subtitle="fg / bg / border tokens mapped to palette" viewport="700x260" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="col" style="gap:6px">
    <div style="display:grid;grid-template-columns:140px 1fr 140px;gap:10px;align-items:center">
      <div class="mono">--qs-fg-1</div>
      <div style="height:28px;border-radius:6px;background:#000710"></div>
      <div class="mono" style="text-align:right">#000710</div>
    </div>
    <div style="display:grid;grid-template-columns:140px 1fr 140px;gap:10px;align-items:center">
      <div class="mono">--qs-fg-2</div>
      <div style="height:28px;border-radius:6px;background:#3A3A3A"></div>
      <div class="mono" style="text-align:right">#3A3A3A</div>
    </div>
    <div style="display:grid;grid-template-columns:140px 1fr 140px;gap:10px;align-items:center">
      <div class="mono">--qs-fg-3</div>
      <div style="height:28px;border-radius:6px;background:#8E8E8E"></div>
      <div class="mono" style="text-align:right">#8E8E8E</div>
    </div>
    <div style="display:grid;grid-template-columns:140px 1fr 140px;gap:10px;align-items:center">
      <div class="mono">--qs-fg-4</div>
      <div style="height:28px;border-radius:6px;background:#727272"></div>
      <div class="mono" style="text-align:right">#727272</div>
    </div>
    <div style="display:grid;grid-template-columns:140px 1fr 140px;gap:10px;align-items:center">
      <div class="mono">--qs-border</div>
      <div style="height:28px;border-radius:6px;background:#FAFAFA;border:1px solid rgba(0,7,14,0.08)"></div>
      <div class="mono" style="text-align:right">rgba(0,7,14,.08)</div>
    </div>
    <div style="display:grid;grid-template-columns:140px 1fr 140px;gap:10px;align-items:center">
      <div class="mono">--qs-bg-dark</div>
      <div style="height:28px;border-radius:6px;background:#141414"></div>
      <div class="mono" style="text-align:right">#141414</div>
    </div>
  </div>
</div></body></html>
