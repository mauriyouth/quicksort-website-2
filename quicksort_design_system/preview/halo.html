<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="row" style="gap:14px">
    <div style="flex:1;position:relative;height:180px;border-radius:14px;overflow:hidden;background:#FAFAFA">
      <div style="position:absolute;left:50%;top:-90px;width:110%;height:160px;transform:translateX(-50%);border-radius:50%;background:#CCFF00;opacity:0.4;filter:blur(14px)"></div>
      <div style="position:absolute;bottom:16px;left:16px;font-family:Inter;font-size:14px;color:#000710;font-weight:500">Light · lime halo</div>
    </div>
    <div style="flex:1;position:relative;height:180px;border-radius:14px;overflow:hidden;background:#151515">
      <div style="position:absolute;left:50%;top:-90px;width:110%;height:160px;transform:translateX(-50%);border-radius:50%;background:#fff;opacity:0.10;filter:blur(14px)"></div>
      <div style="position:absolute;bottom:16px;left:16px;font-family:Inter;font-size:14px;color:#FAFAFA;font-weight:500">Dark · white halo</div>
    </div>
  </div>
</div></body></html>
