<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="6 / 10 / 16 / 20 + pill" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="row" style="gap:14px">
    <div class="col" style="flex:1;align-items:center">
      <div style="width:90px;height:90px;border-radius:6px;background:#FAFAFA;border:1px solid rgba(0,7,14,.08)"></div>
      <div class="mono">6 · sm</div>
    </div>
    <div class="col" style="flex:1;align-items:center">
      <div style="width:90px;height:90px;border-radius:10px;background:#FAFAFA;border:1px solid rgba(0,7,14,.08)"></div>
      <div class="mono">10 · md (capsule)</div>
    </div>
    <div class="col" style="flex:1;align-items:center">
      <div style="width:90px;height:90px;border-radius:16px;background:#FAFAFA;border:1px solid rgba(0,7,14,.08)"></div>
      <div class="mono">16 · lg (card)</div>
    </div>
    <div class="col" style="flex:1;align-items:center">
      <div style="width:90px;height:90px;border-radius:20px;background:#141414"></div>
      <div class="mono">20 · xl (hero)</div>
    </div>
    <div class="col" style="flex:1;align-items:center">
      <div style="width:90px;height:40px;border-radius:999px;background:#CCFF00"></div>
      <div class="mono">pill · 999</div>
    </div>
  </div>
</div></body></html>
