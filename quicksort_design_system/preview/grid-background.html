<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="position:relative;height:200px;border-radius:14px;overflow:hidden;background:#FAFAFA;
    background-image:
      linear-gradient(to right, rgba(0,7,14,0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,7,14,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 0%, transparent 85%);
            mask-image: radial-gradient(ellipse at 50% 30%, black 0%, transparent 85%);
    ">
  </div>
  <div class="mono" style="margin-top:10px">96px cell (shown at 48) · 1px hairline · radial mask fades to edges</div>
</div></body></html>
