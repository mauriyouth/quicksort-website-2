<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="col" style="gap:10px">
    <label class="label" style="font-weight:500;color:#000710">Work email</label>
    <input placeholder="you@company.com" style="font-family:Inter;font-size:14px;color:#000710;background:#FAFAFA;border:1px solid rgba(0,7,14,0.12);border-radius:10px;padding:12px 14px;outline:none"/>
    <div style="display:flex;gap:8px;margin-top:4px">
      <span style="display:inline-flex;align-items:center;gap:6px;font-family:Inter;font-size:12px;background:#141414;color:#FAFAFA;border-radius:999px;padding:4px 10px">
        <span style="width:6px;height:6px;border-radius:50%;background:#CCFF00"></span> Active
      </span>
      <span style="display:inline-flex;align-items:center;font-family:Inter;font-size:12px;background:#FAFAFA;color:#000710;border:1px solid rgba(0,7,14,0.12);border-radius:999px;padding:4px 10px">Enterprise</span>
      <span style="display:inline-flex;align-items:center;font-family:Inter;font-size:12px;background:#CCFF00;color:#141414;border-radius:999px;padding:4px 10px;font-weight:500">New</span>
    </div>
  </div>
</div></body></html>
